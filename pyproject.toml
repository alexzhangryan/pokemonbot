[project]
name = "champions-bot"
version = "0.0.1"
description = "An agent and coach for Pokemon Champions doubles (Regulation M-B)"
requires-python = ">=3.12"
dependencies = [
    "poke-env>=0.8",
    "numpy>=2.0",
    "scipy>=1.14",
    "torch>=2.4",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "websockets>=13.0",
    "httpx>=0.27",
    "pydantic>=2.9",
    "orjson>=3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
    "hypothesis>=6.0",
    # Browser QA for the viewer. Needs `playwright install chromium` once.
    "playwright>=1.48",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["champions"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
disallow_untyped_defs = true
explicit_package_bases = true
mypy_path = "."
exclude = "^vendor/"
